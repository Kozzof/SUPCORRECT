global
    log /dev/log local0
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+CHACHA20

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_in
    bind *:80
    http-request redirect scheme https code 301

frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/supcorrect.pem
    http-request set-header X-Forwarded-Proto https
    default_backend web_nodes

backend web_nodes
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web-1 10.0.0.11:8080 check
    server web-2 10.0.0.12:8080 check
