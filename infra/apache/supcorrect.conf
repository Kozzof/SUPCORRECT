<VirtualHost *:8080>
    ServerName supcorrect.internal
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
    LimitRequestBody 131072
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self'"

    ErrorLog ${APACHE_LOG_DIR}/supcorrect-error.log
    CustomLog ${APACHE_LOG_DIR}/supcorrect-access.log combined
</VirtualHost>
